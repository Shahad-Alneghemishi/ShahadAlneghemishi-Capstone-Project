{% extends "store/base.html" %}

{% block title %}Delete device{% endblock %}

{% block content %}
  <h1>Delete device</h1>
  <p>Are you sure you want to delete {{ device.brand }} {{ device.model_name }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'store:device_list' %}">Cancel</a>
  </form>
{% endblock %}
